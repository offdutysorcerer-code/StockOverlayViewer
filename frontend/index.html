<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Overlay Viewer</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Stock Overlay Viewer</h1>
      <p>Group stocks and compare intraday and daily charts.</p>
    </div>
    <div class="toolbar">
      <select id="providerSelect" aria-label="quote provider">
        <option value="mock">Mock Feed</option>
        <option value="twse">TWSE Feed</option>
        <option value="us">US Feed</option>
      </select>
      <button id="startFeedButton">Start Feed</button>
      <button id="stopFeedButton">Stop Feed</button>
      <button id="refreshButton">Refresh</button>
      <button id="resetGroupsButton">Reset Groups</button>
      <button id="importSymbolButton">Import Symbols</button>
      <input type="file" id="symbolFileInput" accept=".json,.csv" style="display:none;" />
      <select id="priceModeSelect" aria-label="price mode">
        <option value="indexed">Indexed = 100</option>
        <option value="actual">Actual Price</option>
      </select>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <div class="panel-header compact">
          <h2>Groups</h2>
          <button id="addGroupButton" class="small-button">Add</button>
        </div>
        <div id="groupList" class="group-list"></div>
      </section>

      <section class="panel">
        <div class="panel-header compact">
          <h2>Symbols</h2>
          <button id="addSymbolButton" class="small-button">Add</button>
        </div>
        <div id="symbolList" class="symbol-list"></div>
      </section>
    </aside>

    <section class="content">
      <section class="panel chart-panel">
        <div class="panel-header">
          <h2>Intraday Overlay</h2>
          <span id="intradayStatus" class="status">Not loaded</span>
        </div>
        <div class="chart-container">
          <canvas id="intradayChart"></canvas>
        </div>
      </section>

      <section class="panel chart-panel daily-panel">
        <div class="panel-header">
          <h2>Daily Chart</h2>
          <div class="daily-controls">
            <select id="dailySymbolSelect" aria-label="daily chart symbol"></select>
            <span id="dailyStatus" class="status">Not loaded</span>
          </div>
        </div>
        <div class="daily-chart-container">
          <canvas id="dailyChart"></canvas>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
